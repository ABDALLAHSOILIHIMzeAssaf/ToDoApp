<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: base(~{::content}, 'TodoApp-Mes tâches', 'mes-taches')}">

<div th:fragment="content" class="container py-4">
    <!-- Titre de la page -->
    <h1 class="mb-4">
        <i class="bi bi-list-check"></i>
        Mes tâches
    </h1>

    <div th:if="${messageSucces != null}" class="alert alert-success" role="status"
         th:text="${messageSucces}"></div>
    <div th:if="${messageErreur != null}" class="alert alert-warning" role="alert"
         th:text="${messageErreur}"></div>

    <!-- Aucun utilisateur sélectionné -->
    <div th:if="${utilisateurActif == null}" class="alert alert-warning" role="alert">
        <i class="bi bi-exclamation-triangle"></i>
        Aucun utilisateur sélectionné.
        Veuillez choisir un utilisateur dans le menu supérieur.
    </div>

    <!-- Affichage si un utilisateur est sélectionné -->
    <div th:if="${utilisateurActif != null}">

        <!-- Présentation de l'utilisateur -->
        <div class="alert alert-info">
            <i class="bi bi-person-circle"></i> Tâches de
            <strong th:text="${utilisateurActif.prenom + ' ' + utilisateurActif.nom}"></strong>
        </div>
        <div class="mb-4">
            <a th:href="@{/mes-taches/creer}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Créer une tâche
            </a>
        </div>
        <!-- Aucune tâche enregistrée -->
        <div th:if="${#lists.isEmpty(taches)}" class="alert alert-secondary">
            <i class="bi bi-info-circle"></i>
            Aucune tâche enregistrée pour cet utilisateur.
        </div>

        <!-- Tableau des tâches -->
        <div th:if="${not #lists.isEmpty(taches)}" class="card shadow-sm">
            <div class="card-header">
                <h2 class="h5 mb-0">
                    <i class="bi bi-card-checklist"></i>
                    Liste des tâches
                    <span class="badge text-bg-secondary" th:text="${#lists.size(taches)}"></span>
                </h2>
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Identifiant</th>
                            <th>Titre</th>
                            <th>Description</th>
                            <th>Date de création</th>
                            <th>Échéance</th>
                            <th>État</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="tache : ${taches}">
                            <!-- Identifiant -->
                            <td th:text="${tache.idTache}"></td>
                            <!-- Titre -->
                            <td th:text="${tache.titre}"></td>
                            <!-- Description -->
                            <td th:text="${tache.description != null ? tache.description : '-'}"></td>
                            <!-- Date de création -->
                            <td th:text="${#temporals.format(tache.dateCreation, 'dd/MM/yyyy HH:mm')}"></td>
                            <!-- Date d'échéance -->
                            <td th:text="${tache.dateEcheance != null ? #temporals.format(tache.dateEcheance, 'dd/MM/yyyy') : '-'}">
                            </td>
                            <!-- État de la tâche -->
                            <td>
                                <span class="badge"
                                      th:classappend="${tache.terminee} ? 'text-bg-success' : 'text-bg-warning'"
                                      th:text="${tache.terminee} ? 'Terminée' : 'En cours'">
                                </span>
                            </td>
                            <td>
                                <a th:href="@{/mes-taches/{id}/modifier(id=${tache.idTache})}"
                                   class="btn btn-outline-primary btn-sm"
                                   th:aria-label="${'Modifier la tâche : ' + tache.titre}">
                                    <i class="bi bi-pencil-square"></i> Modifier
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
